name: Deploy on Push

on:
  push:
    branches: [main]
    paths: ['index.html', 'admin_supabase.html', '*.css', '*.js']

jobs:
  deploy:
    name: Deploy → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Deploy
        run: npx wrangler@latest pages deploy . --project-name=bmax-motor --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
